<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LordMarshy — Design, Build, Ship</title>
  <desc id="desc">An animated editorial dashboard that builds itself section by section.</desc>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .stage { opacity: 0; animation: enter 12s infinite both; }
    .sidebar { animation-delay: .45s; }
    .brand { animation-delay: 1.15s; }
    .nav1 { animation-delay: 1.75s; } .nav2 { animation-delay: 1.9s; } .nav3 { animation-delay: 2.05s; }
    .nav4 { animation-delay: 2.2s; } .nav5 { animation-delay: 2.35s; } .nav6 { animation-delay: 2.5s; }
    .mark { animation-delay: 3.15s; } .name { animation-delay: 3.7s; }
    .design { animation-delay: 4.35s; } .build { animation-delay: 4.9s; } .ship { animation-delay: 5.45s; }
    .detail { animation-delay: 6.05s; } .footer { animation-delay: 6.35s; }
    .cursor { animation: cursor 12s infinite both; }
    .ring-a { animation: clicka 12s infinite both; } .ring-b { animation: clickb 12s infinite both; }
    .underline { stroke-dasharray: 270; stroke-dashoffset: 270; animation: draw 12s infinite both; }
    @keyframes enter { 0%, 3% { opacity: 0; transform: translateY(12px); } 7%, 82% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes draw { 0%, 47% { stroke-dashoffset: 270; } 55%, 82% { stroke-dashoffset: 0; } 90%, 100% { stroke-dashoffset: 270; } }
    @keyframes cursor { 0%, 4% { opacity: 0; transform: translate(190px,515px); } 7%, 18% { opacity: 1; transform: translate(190px,515px); } 23% { opacity: 1; transform: translate(610px,440px); } 28% { opacity: 1; transform: translate(610px,440px) scale(.94); } 32% { opacity: 1; transform: translate(790px,355px); } 37% { opacity: 1; transform: translate(790px,355px) scale(.94); } 42% { opacity: 1; transform: translate(890px,475px); } 47% { opacity: 1; transform: translate(890px,475px) scale(.94); } 55% { opacity: 0; transform: translate(890px,475px); } 100% { opacity: 0; } }
    @keyframes clicka { 0%, 21%, 28%, 30%, 36%, 38%, 45%, 47%, 100% { opacity: 0; } 23%, 32%, 42% { opacity: .65; } 25%, 34%, 44% { opacity: 0; } }
    @keyframes clickb { 0%, 22%, 28%, 31%, 37%, 41%, 47%, 100% { opacity: 0; } 23.5%, 32.5%, 42.5% { opacity: .35; } 25.5%, 34.5%, 44.5% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .stage { opacity: 1; animation: none; } .cursor, .ring-a, .ring-b { display: none; } .underline { stroke-dashoffset: 0; animation: none; } }
  </style>

  <rect width="1200" height="630" fill="#eae5d7"/>
  <rect class="stage sidebar" x="24" y="24" width="300" height="582" rx="18" fill="#e2dccd"/>
  <rect class="stage sidebar" x="348" y="24" width="828" height="582" rx="22" fill="#f8f3e9"/>

  <g class="stage brand">
    <path d="M55 62h38M61 62V45m11 17V40m11 22V47m11 15V38m-43 24h46" fill="none" stroke="#722f2a" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="66" class="sans" font-size="18" font-weight="700" fill="#722f2a">LordMarshy</text>
    <path d="M48 95h244" stroke="#c8bfad"/>
  </g>
  <g class="sans" font-size="15" font-weight="650" fill="#262421">
    <g class="stage nav1"><text x="48" y="137">01 · Discover</text><text x="276" y="137" fill="#766f64">↗</text></g>
    <g class="stage nav2"><text x="48" y="184">02 · Define</text><text x="276" y="184" fill="#766f64">↗</text></g>
    <g class="stage nav3"><text x="48" y="231">03 · Design</text><text x="276" y="231" fill="#766f64">↗</text></g>
    <g class="stage nav4"><text x="48" y="278">04 · Front-end</text><text x="276" y="278" fill="#766f64">↗</text></g>
    <g class="stage nav5"><text x="48" y="325">05 · Back-end</text><text x="276" y="325" fill="#766f64">↗</text></g>
    <g class="stage nav6"><text x="48" y="372">06 · Ship</text><text x="276" y="372" fill="#766f64">↗</text></g>
  </g>

  <g class="stage mark">
    <g transform="translate(520 122)">
      <rect x="0" y="42" width="148" height="10" rx="2" fill="#722f2a"/>
      <path d="M30 42V5m29 37V-9m29 51V12m29 30V-3" stroke="#24221f" stroke-width="3"/>
      <circle cx="30" cy="4" r="8" fill="#24221f"/><circle cx="59" cy="-10" r="8" fill="#24221f"/><circle cx="88" cy="11" r="8" fill="#24221f"/><circle cx="117" cy="-4" r="8" fill="#24221f"/>
    </g>
  </g>
  <g class="stage name">
    <text x="520" y="274" class="serif" font-size="61" font-weight="700" fill="#201e1b">LordMarshy</text>
    <text x="522" y="309" class="sans" font-size="13" letter-spacing="3.6" fill="#722f2a">PRODUCT ENGINEER</text>
  </g>
  <g class="sans" font-weight="750" font-size="31" letter-spacing="1.2" fill="#201e1b">
    <text class="stage design" x="520" y="375">DESIGN</text>
    <text class="stage build" x="520" y="423">BUILD</text>
    <text class="stage ship" x="520" y="471">SHIP</text>
  </g>
  <path class="underline" d="M520 489H790" fill="none" stroke="#722f2a" stroke-width="5" stroke-linecap="round"/>
  <g class="stage detail">
    <rect x="908" y="345" width="204" height="130" rx="12" fill="#eee7da" stroke="#d8cfbd"/>
    <path d="M930 433c16-29 29 12 46-17s24-20 39-6 31 11 48-27 28 2 31-18" fill="none" stroke="#722f2a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="930" cy="433" r="4" fill="#722f2a"/><circle cx="1094" cy="365" r="4" fill="#722f2a"/>
    <text x="930" y="373" class="sans" font-size="11" font-weight="700" letter-spacing="1.5" fill="#766f64">FROM IDEA TO IMPACT</text>
  </g>
  <text class="stage footer sans" x="520" y="553" font-size="14" fill="#766f64">A blank page, thoughtfully brought to life.</text>

  <g class="cursor" transform="translate(190 515)">
    <path d="M0 0L0 27 7 20 13 33 19 30 13 17 24 17Z" fill="#201e1b" stroke="#f8f3e9" stroke-width="2" stroke-linejoin="round"/>
    <circle class="ring-a" cx="7" cy="10" r="15" fill="none" stroke="#722f2a" stroke-width="2"/>
    <circle class="ring-b" cx="7" cy="10" r="26" fill="none" stroke="#722f2a" stroke-width="1.5"/>
  </g>
</svg>
