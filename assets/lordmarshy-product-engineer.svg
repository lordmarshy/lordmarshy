<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LordMarshy — Full-Stack Product Engineer</title>
  <desc id="desc">An animated editorial dashboard that builds itself section by section.</desc>
  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .stage { opacity: 0; animation: enter 16.6s infinite both; }
    .sidebar-shell { animation-delay: 2.05s; }
    .content-shell { animation-delay: 3.75s; }
    .rail { animation-delay: 2.55s; }
    .nav1 { animation-delay: 2.7s; } .nav2 { animation-delay: 2.88s; } .nav3 { animation-delay: 3.06s; }
    .nav4 { animation-delay: 3.24s; } .nav5 { animation-delay: 3.42s; } .nav6 { animation-delay: 3.6s; }
    .name { animation-delay: 4.55s; }
    .design { animation-delay: 5.1s; } .build { animation-delay: 5.55s; } .ship { animation-delay: 6s; }
    .cursor { animation: cursor 16.6s infinite both; }
    .ring-a { animation: clicka 16.6s infinite both; } .ring-b { animation: clickb 16.6s infinite both; }
    .rail-line { stroke-dasharray: 260; stroke-dashoffset: 260; animation: rail-draw 16.6s 2.55s infinite both; }
    /* Keep the original reveal and click timings, then pause for 1 second after SHIP fades. */
    @keyframes enter { 0%, 2.169% { opacity: 0; transform: translateY(12px); } 5.060%, 59.277% { opacity: 1; transform: translateY(0); } 65.060%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes rail-draw { 0%, 1.446% { stroke-dashoffset: 260; } 8.675%, 59.277% { stroke-dashoffset: 0; } 65.060%, 100% { stroke-dashoffset: 260; } }
    @keyframes cursor { 0%, 5.060% { opacity: 0; transform: translate(62px,254px); } 7.229%, 12.289% { opacity: 1; transform: translate(62px,254px); } 15.181% { opacity: 1; transform: translate(62px,254px) scale(.94); } 18.795% { opacity: 1; transform: translate(553px,170px); } 23.133% { opacity: 1; transform: translate(553px,170px) scale(.94); } 26.747% { opacity: 1; transform: translate(513px,215px); } 30.361% { opacity: 1; transform: translate(513px,215px) scale(.94); } 34.699% { opacity: 0; transform: translate(513px,215px); } 100% { opacity: 0; } }
    @keyframes clicka { 0%, 13.735%, 15.904%, 21.687%, 23.855%, 28.916%, 31.084%, 100% { opacity: 0; } 15.181%, 23.133%, 30.361% { opacity: .65; } 16.627%, 24.578%, 31.807% { opacity: 0; } }
    @keyframes clickb { 0%, 14.458%, 15.904%, 22.410%, 23.855%, 29.639%, 31.084%, 100% { opacity: 0; } 15.542%, 23.494%, 30.723% { opacity: .35; } 16.988%, 24.940%, 32.169% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .stage { opacity: 1; animation: none; } .cursor, .ring-a, .ring-b { display: none; } .rail-line { stroke-dashoffset: 0; animation: none; } }
  </style>

  <rect width="1200" height="630" fill="#eae5d7"/>
  <rect class="stage sidebar-shell" x="24" y="24" width="300" height="582" rx="18" fill="#e2dccd"/>
  <rect class="stage content-shell" x="348" y="24" width="828" height="582" rx="22" fill="#f8f3e9"/>

  <g class="stage rail">
    <path class="rail-line" d="M76 160V420" fill="none" stroke="#bdb3a1" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g>
    <g class="stage nav1"><circle cx="76" cy="160" r="9" fill="#262421"/><rect x="104" y="153" width="142" height="14" rx="7" fill="#bdb3a1"/></g>
    <g class="stage nav2"><circle cx="76" cy="212" r="9" fill="#262421"/><rect x="104" y="205" width="104" height="14" rx="7" fill="#c8bfad"/></g>
    <g class="stage nav3"><circle cx="76" cy="264" r="9" fill="#262421"/><rect x="104" y="257" width="165" height="14" rx="7" fill="#bdb3a1"/></g>
    <g class="stage nav4"><circle cx="76" cy="316" r="9" fill="#262421"/><rect x="104" y="309" width="121" height="14" rx="7" fill="#c8bfad"/></g>
    <g class="stage nav5"><circle cx="76" cy="368" r="9" fill="#262421"/><rect x="104" y="361" width="152" height="14" rx="7" fill="#bdb3a1"/></g>
    <g class="stage nav6"><circle cx="76" cy="420" r="10" fill="#722f2a"/><rect x="104" y="413" width="116" height="14" rx="7" fill="#722f2a"/></g>
  </g>

  <g class="stage name">
    <text x="520" y="190" class="serif" font-size="58" font-weight="700" fill="#201e1b">LordMarshy</text>
    <text x="522" y="226" class="sans" font-size="13" letter-spacing="3.6" fill="#722f2a">FULL-STACK PRODUCT ENGINEER</text>
  </g>
  <g class="stage design sans" font-size="31" font-weight="750" letter-spacing="1.2">
    <text x="520" y="312" fill="#722f2a">DESIGN</text>
    <path d="M742 303H1090" stroke="#c8bfad" stroke-width="3"/>
    <path d="M742 303H985" stroke="#722f2a" stroke-width="3"/>
    <circle cx="985" cy="303" r="9" fill="#722f2a"/>
  </g>
  <g class="stage build sans" font-size="31" font-weight="750" letter-spacing="1.2">
    <text x="520" y="372" fill="#722f2a">BUILD</text>
    <path d="M742 363H1090" stroke="#c8bfad" stroke-width="3"/>
    <path d="M742 363H1035" stroke="#722f2a" stroke-width="3"/>
    <circle cx="1035" cy="363" r="9" fill="#722f2a"/>
  </g>
  <g class="stage ship sans" font-size="31" font-weight="750" letter-spacing="1.2">
    <text x="520" y="432" fill="#722f2a">SHIP</text>
    <path d="M742 423H1090" stroke="#c8bfad" stroke-width="3"/>
    <path d="M742 423H1070" stroke="#722f2a" stroke-width="3"/>
    <circle cx="1070" cy="423" r="9" fill="#722f2a"/>
  </g>
  <g class="cursor" transform="translate(190 515)">
    <path d="M0 0L0 27 7 20 13 33 19 30 13 17 24 17Z" fill="#201e1b" stroke="#f8f3e9" stroke-width="2" stroke-linejoin="round"/>
    <circle class="ring-a" cx="7" cy="10" r="15" fill="none" stroke="#722f2a" stroke-width="2"/>
    <circle class="ring-b" cx="7" cy="10" r="26" fill="none" stroke="#722f2a" stroke-width="1.5"/>
  </g>
</svg>
